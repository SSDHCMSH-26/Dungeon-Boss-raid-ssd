<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>픽셀 던전 레이드 30×30</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14101f;--pn:#2a2140;--pn2:#3a2f5b;--ln:#0b0812;--fg:#f4e9c9;--m:#a99ec8;--gd:#e0a030}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overscroll-behavior:none}
*{box-sizing:border-box}
body{overscroll-behavior:none;touch-action:manipulation;margin:0;min-height:100%;background-color:var(--bg);background-image:linear-gradient(#ffffff0a 2px,transparent 2px),linear-gradient(90deg,#ffffff0a 2px,transparent 2px);background-size:24px 24px;color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-weight:600}
main{max-width:640px;margin:0 auto;padding:10px}
h1{font:14px/1.5 "Press Start 2P",monospace;color:var(--gd);margin:6px 0 10px;text-shadow:3px 3px 0 var(--ln)}
h1 small{display:block;font:600 12px "Noto Sans KR",sans-serif;color:var(--m);text-shadow:none}
#st{background:var(--pn);border:3px solid var(--ln);box-shadow:inset 0 0 0 2px var(--pn2);padding:7px 9px;font-size:13px;margin:4px 0}
#lg{font-size:13px;color:var(--m);min-height:36px;padding:2px 4px}
#mw{position:relative}
#w{overscroll-behavior:contain;touch-action:pan-x pan-y;height:54vh;overflow:auto;border:4px solid var(--ln);box-shadow:0 0 0 3px var(--pn2);background:#000}
canvas{display:block;image-rendering:pixelated}
#am{display:none;position:absolute;left:4px;right:4px;bottom:4px;max-height:62%;overflow:auto;background:rgba(20,16,31,.48);border:3px solid var(--gd);box-shadow:0 0 0 3px var(--ln);padding:6px;z-index:5}
#am .b{background:rgba(58,47,91,.72)}#am .b.go{background:rgba(63,155,74,.8)}#am .b:disabled{opacity:.3}
#qk{display:none;margin:6px 0;padding:6px;background:var(--pn);border:3px solid var(--gd);box-shadow:0 0 0 3px var(--ln)}#qk .r{margin:4px 0}#ip{display:none;margin:6px 0;padding:8px;background:var(--pn);border:3px solid var(--gd);box-shadow:0 0 0 3px var(--ln)}
#ip .iph{display:flex;justify-content:space-between;align-items:center;gap:8px}#ip .ipn b{font-size:16px}#ip .ipn img{vertical-align:middle}
#ip .ipt{font-size:11px;padding:1px 6px;border:1px solid var(--m);margin-left:6px;color:var(--m)}#ip .ipt.foe{border-color:#e55;color:#f99}
#ip .iphp{font-size:13px;margin:4px 0 2px}#ip .r{margin:6px 0}
#ip .ipr{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid #ffffff14}#ip .ipr span{color:var(--m);flex:none}#ip .ipr b{text-align:right;font-weight:600}
#ip .ips{padding:4px 0;border-bottom:1px solid #ffffff14;font-size:13px}#ip .ips span{color:var(--m);font-size:12px}#ip .ips small{display:block;opacity:.85;font-weight:600}
#cf{display:none;position:sticky;bottom:6px;z-index:6;margin:6px 0;padding:6px 8px;background:var(--pn);border:3px solid var(--gd);box-shadow:0 0 0 3px var(--ln)}
#cf .r{margin:4px 0 0}#cf .ht{font-size:12.5px;color:var(--fg)}#cf .ht b{color:var(--gd)}
.ah{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px}.ah img{vertical-align:middle;image-rendering:pixelated}
.x{border:2px solid var(--ln);background:var(--pn2);color:var(--fg);font-size:12px;padding:3px 7px;cursor:pointer}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ht{font-size:12px;color:var(--m);padding:2px}
.r{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#am .r{margin:4px 0}
.b{flex:1;min-width:92px;padding:9px 6px;border:3px solid var(--ln);background:var(--pn2);color:var(--fg);font:700 13px "Apple SD Gothic Neo","Noto Sans KR",sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--ln),inset 0 0 0 2px #ffffff1a}
.b.s{padding:6px 4px;font-size:12px;min-width:0;box-shadow:0 3px 0 var(--ln),inset 0 0 0 2px #ffffff1a}.b.s small{font-weight:600;opacity:.8}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ln)}
.b.on{background:var(--gd);color:#201505}.b.go{background:#3f9b4a}.b.end{background:#b03a3a;width:100%}.b:disabled{opacity:.35}
.bar{height:7px;background:#000;margin-top:3px;border:1px solid var(--ln)}.bar i{display:block;height:100%}
.u{flex:1;min-width:100px;padding:6px;border:3px solid var(--ln);background:var(--pn);font-size:12px;cursor:pointer}.u img,.b img{vertical-align:middle;image-rendering:pixelated}
.u.s{border-color:var(--gd)}.u.x{opacity:.35}
.cc{display:flex;gap:8px;align-items:center;text-align:left;min-width:100%}
.cc img{flex:none;image-rendering:pixelated}.cc small{display:block;font-weight:600;opacity:.8}
.cc .tp{width:128px;height:32px;margin-top:4px}
.cc.lock{opacity:.7}
body.d-v{--bg:#0e131c;--pn:#171e2b;--pn2:#232d40;--ln:#06090f;--fg:#e8e2d0;--m:#8d9bb5;--gd:#c9a24a;background-image:linear-gradient(#5ac8ff08 2px,transparent 2px),linear-gradient(90deg,#5ac8ff08 2px,transparent 2px)}
body.d-v #w{box-shadow:0 0 0 3px #232d40,0 0 14px #5ac8ff44}body.d-v .b.on{color:#14100a}body.d-v .u.s{box-shadow:0 0 8px #c9a24a88}
body.d-v2{--bg:#0f0d12;--pn:#1c1921;--pn2:#2a2530;--ln:#07060a;--fg:#efe6d4;--m:#a597ad;--gd:#e0902f;background-image:linear-gradient(#e0902f09 2px,transparent 2px),linear-gradient(90deg,#e0902f09 2px,transparent 2px)}
body.d-v2 #w{box-shadow:0 0 0 3px #2a2530,0 0 14px #5ac8ff33}body.d-v2 .b.on{color:#140c04}body.d-v2 .u.s{box-shadow:0 0 8px #e0902f88}body.d-v2 h1{color:#e0902f}
img{object-fit:contain}
.vcard{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;text-align:left;min-width:100%;color:#f4e9c9;background:linear-gradient(135deg,#1c2029,#0d0f14);border:3px solid #c9a24a;box-shadow:0 0 0 2px #06090f,0 0 14px #5ac8ff33}
.vcard.v2{background:linear-gradient(135deg,#221d27,#0f0d12);border-color:#e0902f;box-shadow:0 0 0 2px #07060a,0 0 14px #e0902f44}
.vcard.on,.vcard.v2.on{background:linear-gradient(135deg,#2c2432,#14101c);color:#f4e9c9;box-shadow:0 0 0 3px #ffd34d,0 0 18px #ffd34daa}
.vcard .vtop{display:flex;align-items:stretch}
.vcard .vp{flex:none;width:150px;min-height:150px;position:relative;overflow:hidden}
.vcard .vp img.vf{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;image-rendering:pixelated;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.vcard .vb{flex:1;min-width:0;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.vcard .vt{font:8px "Press Start 2P",monospace;color:#c9a24a;letter-spacing:.5px;line-height:1.4}.vcard.v2 .vt{color:#e0902f}
.vcard b{font-size:18px;letter-spacing:.5px;text-shadow:2px 2px 0 #000}
.vcard .vs{color:#c9a24a;font-style:italic;font-weight:700;opacity:1;line-height:1.3}.vcard.v2 .vs{color:#e0902f}
.vcard .vtg{display:flex;flex-wrap:wrap;gap:3px}.vcard .vtg i{font-style:normal;font-size:10.5px;padding:1px 5px;border:1px solid #c9a24a99;background:#0008}.vcard.v2 .vtg i{border-color:#e0902f99}
.vcard .vq{font-style:italic;opacity:.75;line-height:1.35}
.vcard .vbot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:#0007;border-top:1px solid #ffffff18}
.vcard .vi{display:flex;gap:4px;align-items:flex-end;height:30px;flex:1;min-width:0;overflow:hidden}.vcard .vi img{height:28px;width:auto;flex:none}
.vcard .tp{width:128px;height:32px;flex:none;margin:0}
.vcard .vh{display:block;height:6px;background:repeating-linear-gradient(45deg,#e0902f 0 6px,#17140f 6px 12px)}
body.d-g{--bg:#0c0708;--pn:#1c1112;--pn2:#2b1a1c;--ln:#050203;--fg:#f0e2d6;--m:#b09a9a;--gd:#e0553a;background-image:linear-gradient(#e0553a09 2px,transparent 2px),linear-gradient(90deg,#e0553a09 2px,transparent 2px)}
body.d-g #w{box-shadow:0 0 0 3px #2b1a1c,0 0 14px #e0553a44}body.d-g .b.on{color:#1a0805}body.d-g .u.s{box-shadow:0 0 8px #e0553a88}body.d-g h1{color:#e0553a}
.gcard{background:linear-gradient(135deg,#241416,#0d0809);border-color:#b8412f;box-shadow:0 0 0 2px #060304,0 0 14px #e0553a44}
.gcard .vt,.gcard .vs{color:#e0553a}.gcard .vtg i{border-color:#e0553a99}
.gcard .vh{background:repeating-linear-gradient(45deg,#e0553a 0 6px,#140a0a 6px 12px)}
.gcard.on{background:linear-gradient(135deg,#34191b,#150b0d);box-shadow:0 0 0 3px #ffd34d,0 0 18px #ffd34daa}
p{font-size:12.5px;color:var(--m);margin:4px 0}
input{flex:1;min-width:90px;padding:9px;border:3px solid var(--ln);background:var(--pn);color:var(--fg);font-size:15px;text-transform:uppercase}
</style></head><body><main>
<h1><span data-t="html.title">PIXEL DUNGEON RAID</span><small data-t="html.subtitle">30×30 · 1대1 턴제 보스 레이드</small></h1>
<div id="m"></div>
<div id="g" style="display:none">
<div id="st"></div><div id="lg"></div>
<div id="tb" class="r" style="margin:2px 0 6px"><button class="b s" onclick="zoom(-1)">➖</button><button class="b s" onclick="zoom(1)">➕</button><button class="b s" onclick="jump(0)" data-t="tb.boss">👹 보스</button><button class="b s" onclick="jump(1)" data-t="tb.hero">🧙 용사</button><button class="b s" onclick="setDesign()" data-t="tb.design">🎨 디자인</button></div>
<div id="mw"><div id="w"><canvas id="c"></canvas></div><div id="am"></div></div><div id="qk"></div>
<div id="ip"></div>
<div id="cf"></div>
<div id="un" class="r"></div><div id="pn"></div>
</div>
</main>
<script src="lib/validate.js"></script>
<script>
/* 수치 데이터(data/*.json)를 먼저 읽고 검사(lib/validate.js)한 뒤 게임 코드(src/*)를 실행 */
const DATA={};
(async()=>{const V=window.PDRValidate,err=[];
const show=(t,l)=>document.body.insertAdjacentHTML("afterbegin",'<div style="background:#5a1d1d;color:#fff;padding:12px;font:14px sans-serif">⚠️ '+t+(l&&l.length?'<ul style="margin:6px 0 0 18px;padding:0">'+l.slice(0,20).map(x=>"<li>"+String(x).replace(/</g,"&lt;")+"</li>").join("")+"</ul>":"")+'</div>');
try{if(!V)throw new Error("lib/validate.js");await Promise.all(Object.keys(V.FILES).map(async f=>{const r=await fetch(V.FILES[f].path,{cache:"no-cache"});if(!r.ok)throw new Error(V.FILES[f].path+" ("+r.status+")");const j=await r.json();err.push(...V.dataFile(f,j));DATA[f]=V.body(j)}))}
catch(e){show("게임 데이터를 불러오지 못했어요: "+e.message+"<br>index.html 을 파일로 직접 열면 안 돼요. 웹 주소(GitHub Pages)나 로컬 웹서버(python3 -m http.server)로 열어 주세요.");return}
if(!err.length){DATA.maps={};await Promise.all((DATA.mapIndex.maps||[]).map(async id=>{const f=V.mapPath(id);let t="";try{const r=await fetch(f,{cache:"no-cache"});if(!r.ok)throw new Error(r.status);t=await r.text()}catch(e){err.push(f+" ("+e.message+")");return}const e=V.mapText(t,DATA,f);if(!e.length){const j=JSON.parse(t);if(j.id!==id)e.push(f+" › id: 파일 이름과 같은 \""+id+"\" 이어야 해요");DATA.maps[id]=V.body(j)}err.push(...e)}))}
if(!err.length)err.push(...V.links(DATA));
if(err.length){show("게임 데이터에 문제가 있어요 (data/*.json 을 확인하세요):",err);return}
/* 게임 코드: 역할별 파일을 이 순서대로 실행 (core=규칙 계산, render=그리기, ui=화면, input=입력, net=통신·저장, app=진행·시작) */
const SRC=["src/ui/text.js", "src/core/env.js", "src/core/data.js", "src/core/state.js", "src/core/view.js", "src/core/map.js", "src/core/rules.js", "src/core/actions.js", "src/core/ai.js", "src/core/sim.js", "src/render/sprites.js", "src/render/canvas.js", "src/app/client.js", "src/render/images.js", "src/ui/design.js", "src/render/draw.js", "src/ui/panels.js", "src/input/input.js", "src/app/loop.js", "src/net/net.js", "src/app/commands.js", "src/app/main.js"];
let bad="";const onErr=e=>{if(!bad&&e.filename&&SRC.some(f=>e.filename.endsWith(f)))bad=e.filename.split("/").slice(-3).join("/")+" "+e.lineno+"줄: "+e.message};window.addEventListener("error",onErr);
for(const f of SRC){const ok=await new Promise(res=>{const s=document.createElement("script");s.src=f;s.onload=()=>res(1);s.onerror=()=>res(0);document.body.appendChild(s)});if(!ok||bad){show("게임 코드 파일에 문제가 있어요: "+(bad||f));return}}
window.removeEventListener("error",onErr);
window.GAME_READY=1})();
</script></body></html>
