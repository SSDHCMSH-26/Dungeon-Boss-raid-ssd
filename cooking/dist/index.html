<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>셰프의 식탁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fffdf9;--ink:#2b2420;--sub:#7a6d63;--line:#e8dfd3;--accent:#c4512b;--accent2:#2f7d5b;--warn:#b8322a;--tip:#9a6b00;--chip:#f1e9dd;--bar:#e9e0d3;
--t-sweet:#e17aa0;--t-salty:#5b8fd1;--t-sour:#d9b62a;--t-bitter:#6b5b4e;--t-umami:#b0603a;--t-spicy:#d8452b;--t-fat:#d9a35b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1714;--card:#25201c;--ink:#f1e9df;--sub:#ab9e92;--line:#3a322c;--chip:#332b25;--bar:#3a322c;--accent:#e2774f;--accent2:#5fb88d;--warn:#ec6b5f;--tip:#e0b44a}}
:root[data-theme="dark"]{--bg:#1b1714;--card:#25201c;--ink:#f1e9df;--sub:#ab9e92;--line:#3a322c;--chip:#332b25;--bar:#3a322c;--accent:#e2774f;--accent2:#5fb88d;--warn:#ec6b5f;--tip:#e0b44a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
body{padding-bottom:76px}button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
header h1{margin:0;font-size:17px;font-family:"Gowun Batang",serif}
.hstat{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:2px}.hstat b{color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}.card h3{margin:10px 0 6px;font-size:14px}
.muted{color:var(--sub);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.btn.big{width:100%;padding:13px;font-size:16px}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px;margin:0 6px 6px 0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}.chip.lock{opacity:.5}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--sub);margin:0 4px 4px 0}
.grade{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:14px;font-size:28px;font-weight:800;color:#fff;background:var(--sub)}
.g-S{background:#b8860b}.g-A{background:var(--accent2)}.g-B{background:#4a7fb5}.g-C{background:#a0794f}.g-D{background:var(--warn)}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tb{display:grid;grid-template-columns:64px 1fr 30px;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.list .it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
.it .nm{font-weight:600}.it .q{font-weight:700;min-width:32px;text-align:right}
.note{font-size:13.5px;padding:5px 0 5px 22px;position:relative;border-bottom:1px dashed var(--line)}.note:last-child{border:0}
.note:before{position:absolute;left:0;top:5px;font-weight:800}.note.good:before{content:"✓";color:var(--accent2)}.note.bad:before{content:"✗";color:var(--warn)}.note.tip:before{content:"💡"}
.note .c{color:var(--sub);font-size:12px;margin-right:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px}
.sheet .x{float:right;border:0;background:none;font-size:22px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);padding:8px}.seg button.on{background:var(--accent);color:#fff;font-weight:700}
input[type=search],input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input[type=range]{width:100%}
.big{font-size:22px;font-weight:800}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-right:2px}
.scroll-x{display:flex;overflow-x:auto;gap:0;padding-bottom:4px}.scroll-x .chip{flex:none}
.hl{background:linear-gradient(135deg,var(--accent),#e09a3e);color:#fff;border:0}.hl .muted{color:#fff;opacity:.85}
</style>
</head>
<body>
<header></header>
<main><p>불러오는 중…</p></main>
<nav></nav>
<script>
/* 요리 맛 계산 (규칙 core) — 화면·Math.random·Date 를 쓰지 않는다.
   profile(D, spec, season) : 재료+조리법 → 맛·향·질감·온도·무게감·색·원가·완성도(q) + 평가 문구 */
(function (root) {
  'use strict';
  var CK = root.CK = root.CK || {};
  var TN = ['sweet', 'salty', 'sour', 'bitter', 'umami', 'spicy', 'fat'];
  var TK = { sweet: '단맛', salty: '짠맛', sour: '신맛', bitter: '쓴맛', umami: '감칠맛', spicy: '매운맛', fat: '기름진 맛' };
  var AK = { herb: '허브', citrus: '시트러스', roast: '고소한 구운 향', smoke: '훈연', ferment: '발효', floral: '꽃향', earthy: '흙·버섯 향', warm: '따뜻한 향신료', pungent: '알싸한 향', marine: '바다 향', fruity: '과일 향', nutty: '견과 향', dairy: '유제품 향', caramel: '캐러멜·바닐라' };
  var XK = { crispy: '바삭', crunchy: '아삭', creamy: '크리미', chewy: '쫄깃', tender: '부드러운 살', silky: '매끄러운', flaky: '결이 살아 있는', juicy: '촉촉', soft: '폭신', brothy: '국물', crumbly: '부서지는' };
  var TEMPK = { cold: '차가움', room: '상온', warm: '따뜻함', hot: '뜨거움' };
  var COLK = { red: '빨강', orange: '주황', yellow: '노랑', green: '초록', white: '흰색', brown: '갈색', black: '검정', purple: '보라', pink: '분홍' };
  var MEAT = { beef: 1.0, pork: 0.9, lamb: 1.0, poultry: 0.5, fish: 0.4, shellfish: 0.3, egg: 0.2, legume: 0.2 };
  var PROTEIN = { beef: 1, pork: 1, lamb: 1, poultry: 1, fish: 1, shellfish: 1, egg: 1, legume: 1, dairy: 0 };
  var VEG = { veg: 1, leafy: 1, root: 1, mushroom: 1, seaweed: 1 };
  var CARB = { grain: 1, noodle: 1, bread: 1 };
  var NONVEG = { beef: 1, pork: 1, lamb: 1, poultry: 1, fish: 1, shellfish: 1 };
  CK.TN = TN; CK.TK = TK; CK.AK = AK; CK.XK = XK; CK.TEMPK = TEMPK; CK.COLK = COLK;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function r1(v) { return Math.round(v * 10) / 10; }
  CK.clamp = clamp; CK.r1 = r1;

  /* 원본 JSON 묶음 → 게임 표 */
  CK.makeData = function (raw) {
    var D = {
      ing: raw.ingredients.items, cats: raw.ingredients.cats,
      tech: raw.techniques.items, rec: raw.recipes.items,
      cuisines: raw.recipes.cuisines, courses: raw.recipes.courses,
      pairs: raw.pairings.pairs, clash: raw.pairings.clash,
      books: raw.shop.books, equip: raw.shop.equip,
      cust: raw.customers.types, R: raw.rules, know: raw.knowledge.items
    };
    D.recIds = Object.keys(D.rec);
    return D;
  };

  function matchItem(D, tok, ids) {
    if (tok.indexOf('cat:') === 0) { var c = tok.slice(4); return ids.some(function (i) { return D.ing[i] && D.ing[i].c === c; }); }
    return ids.indexOf(tok) >= 0;
  }

  /* "salt*0.4" → ['salt', 0.4] (양: 조금 0.4 / 보통 1 / 많이 1.6) */
  CK.parseI = function (s) { var k = String(s).split('*'); return [k[0], k[1] ? +k[1] : 1]; };
  CK.ids = function (list) { return list.map(function (s) { return CK.parseI(s)[0]; }); };

  /* 한 그릇의 맛 프로필 */
  CK.profile = function (D, spec, season) {
    var tech = D.tech[spec.te] || D.tech.raw;
    var parts = spec.i.map(CK.parseI).filter(function (p) { return D.ing[p[0]]; });
    var ids = parts.map(function (p) { return p[0]; });
    var acc = TN.map(function () { return 1; });
    var aro = {}, tex = {}, cols = {}, us = {}, cost = 0, inSeason = 0, seasonal = 0, nonveg = false;
    var hasProtein = false, hasVeg = false, hasCarb = false, unsafe = [];
    parts.forEach(function (pa, k) {
      var id = pa[0], am = pa[1], g = D.ing[id];
      g.t.forEach(function (v, j) { if (v > 0) acc[j] *= 1 - Math.min(v * am, 5.9) / 6; });
      if (am >= 0.3) (g.a || []).forEach(function (a) { aro[a] = (aro[a] || 0) + 1; });
      (g.x || []).forEach(function (x) { tex[x] = 1; });
      if (g.col && am >= 0.5) cols[g.col] = (cols[g.col] || 0) + (k === 0 ? 2 : 1);
      if (g.u) us[g.u] = 1;
      var m = 1;
      if (g.s) {
        var ins = g.s.indexOf(season) >= 0;
        m = ins ? D.R.seasonCostIn : D.R.seasonCostOut;
        if (g.r !== 's') { seasonal++; if (ins) inSeason++; }
      }
      cost += g.p * m * am;
      if (NONVEG[g.c] || g.nv) nonveg = true;
      if (PROTEIN[g.c]) hasProtein = true;
      if (VEG[g.c] || (g.c === 'fruit' && g.r !== 's')) hasVeg = true;
      if (CARB[g.c] || (g.c === 'root' && (id === 'potato' || id === 'sweet_potato'))) hasCarb = true;
      if ((spec.te === 'raw' || spec.te === 'cure') && g.raw === 0) unsafe.push(g.n);
    });
    var t = {};
    TN.forEach(function (n, j) { t[n] = clamp(6 * (1 - acc[j]) + (tech.t[j] || 0) * (ids.length ? 1 : 0), 0, 5); });
    (tech.a || []).forEach(function (a) { aro[a] = (aro[a] || 0) + 2; });
    (tech.rm || []).forEach(function (x) { delete tex[x]; });
    (tech.x || []).forEach(function (x) { tex[x] = 1; });
    if (tex.brothy && spec.co !== 'guk' && spec.co !== 'soup') delete tex.brothy;
    (spec.x || []).forEach(function (x) { tex[x] = 1; });
    if (['panfry', 'grill', 'roast', 'deepfry', 'bake', 'smoke'].indexOf(spec.te) >= 0) cols.brown = (cols.brown || 0) + 1;
    var main = D.ing[ids[0]] || { c: 'veg', n: '?' };
    var sweetCourse = spec.co === 'dessert';
    var w = sweetCourse ? 1 + t.fat * 0.35 + t.sweet * 0.15 + tech.w * 0.5
      : 1 + t.fat * 0.4 + (MEAT[main.c] || 0) + (hasCarb ? 0.5 : 0) + tech.w + (t.umami > 3 ? 0.3 : 0);
    w = clamp(w, 1, 5);

    /* 지각되는 맛: 상승·억제·대비 효과 */
    var syn = !!(us.glu && (us.ino || us.gua));
    var pt = {};
    TN.forEach(function (n) { pt[n] = t[n]; });
    pt.bitter = Math.max(0, t.bitter - 0.25 * t.salty - 0.2 * t.sweet);
    pt.sour = Math.max(0, t.sour - 0.2 * t.sweet);
    pt.spicy = Math.max(0, t.spicy - 0.12 * t.fat - 0.1 * t.sweet);
    pt.umami = Math.min(5, t.umami * (syn ? 1.25 : 1));
    if (sweetCourse && t.salty >= 0.2 && t.salty <= 1.3) pt.sweet = Math.min(5, t.sweet * 1.1);
    var temp = spec.temp || tech.temp;
    if (sweetCourse && temp === 'cold') pt.sweet *= 0.9;
    TN.forEach(function (n) { pt[n] = r1(pt[n]); t[n] = r1(t[n]); });

    var notes = [], q = 62;
    function add(dq, k, s) { q += dq; notes.push({ k: k, t: s, v: dq }); }
    var aroN = Object.keys(aro).length, texN = Object.keys(tex).length;
    var intensity = pt.sweet + pt.salty + pt.sour + pt.bitter + pt.umami + pt.spicy;
    var cutter = pt.sour >= 1 || pt.spicy >= 1.5 || aro.pungent || aro.citrus || aro.herb || aro.ferment;

    if (unsafe.length) add(-45, 'bad', '식중독 위험! ' + unsafe.join('·') + '은(는) 날로 쓰면 안 된다 (식품 안전)');
    if (!ids.length) add(-60, 'bad', '재료가 없다');
    if (sweetCourse) {
      if (pt.sweet < 1.5) add(-15, 'bad', '디저트인데 단맛이 약하다');
      else if (pt.sweet > 4.6 && pt.sour < 0.8 && pt.bitter < 0.8) add(-6, 'bad', '단맛만 강해 물린다 — 산미나 쌉쌀함으로 받쳐 주자');
      else add(4, 'good', '디저트의 단맛이 적당하다');
      if (t.salty > 1.6) add(-14, 'bad', '디저트가 짜다');
      else if (t.salty >= 0.2) add(5, 'good', '소금 한 꼬집이 단맛을 키운다 (대비효과)');
      if (t.bitter >= 1.2 && t.sweet >= 2) add(4, 'good', '단맛이 쓴맛을 눌러 쌉싸름한 깊이가 된다 (억제효과)');
    } else if (spec.co !== 'cleanser' && spec.co !== 'rice') {
      if (pt.salty < 0.8 && pt.umami < 2) add(-10, 'bad', '간이 싱겁다 — 소금·장으로 간을 하자');
      else if (pt.salty > (spec.co === 'kimchi' ? 4.6 : 4.2)) add(-15, 'bad', '너무 짜다');
      else if (pt.salty >= 1.2 && pt.salty <= 3.5) add(4, 'good', '간이 알맞다');
      if (pt.sweet > 3.5 && pt.sour < 1 && pt.salty < 1.5) add(-6, 'bad', '식사 요리치고 너무 달다');
      if (pt.sweet >= 1.5 && pt.salty >= 1.5) add(3, 'good', '단짠의 균형');
    } else if (spec.co === 'cleanser') {
      if (pt.sour >= 1.5 || temp === 'cold') add(8, 'good', '차갑고 새콤해 입을 씻어 준다');
      else add(-10, 'bad', '입가심인데 새콤함·차가움이 부족하다');
      if (t.fat > 2) add(-8, 'bad', '입가심이 기름지다');
    }
    if (t.fat >= 3 && !cutter && !sweetCourse) add(-12, 'bad', '느끼하다 — 산미(식초·레몬·김치)나 향신 재료로 기름을 잡자');
    else if (t.fat >= 2 && pt.sour >= 1.2) add(6, 'good', '산미가 기름을 깔끔하게 정리한다 (산과 지방의 균형)');
    if (syn) add(8, 'good', '감칠맛 상승효과 (글루탐산 × ' + (us.ino ? '이노신산' : '구아닐산') + ')');
    else if (pt.umami >= 2.5 && !sweetCourse) add(3, 'good', '감칠맛이 풍부하다');
    if (intensity < 2 && spec.co !== 'rice') add(-10, 'bad', '맛이 밋밋하다');
    if (intensity > 15) add(-8, 'bad', '맛이 너무 많아 무엇을 먹는지 모르겠다');
    if (pt.bitter >= 2.5 && !sweetCourse) add(-10, 'bad', '쓴맛이 튄다 — 소금·단맛·지방으로 눌러 주자 (억제효과)');
    if (pt.spicy >= 4) add(-6, 'bad', '매운 자극이 지나치다 — 지방·유제품·단맛으로 누그러뜨리자');
    else if (t.spicy >= 2.5 && pt.spicy < t.spicy - 0.4) add(3, 'good', '지방·단맛이 매운맛을 둥글게 감싼다');
    if (aroN === 0 && spec.co !== 'rice') add(-6, 'bad', '향이 없다 — 허브·향신료·굽기로 향을 더하자');
    else if (aroN >= 2 && aroN <= 4) add(4, 'good', '향의 층이 적당하다 (' + Object.keys(aro).map(function (a) { return AK[a]; }).join(', ') + ')');
    else if (aroN >= 7) add(-6, 'bad', '향이 너무 많아 탁하다');
    if (texN >= 2) add(3, 'good', '질감이 두 가지 이상이다');
    var pairHit = 0;
    D.pairs.forEach(function (p) {
      if (pairHit < 3 && matchItem(D, p.p[0], ids) && matchItem(D, p.p[1], ids)) { pairHit++; add(5, 'good', '좋은 짝: ' + p.r); }
    });
    D.clash.forEach(function (p) {
      if (p.tech && p.tech.indexOf(spec.te) < 0) return;
      if (matchItem(D, p.p[0], ids) && matchItem(D, p.p[1], ids)) add(-9, 'bad', '충돌: ' + p.r);
    });
    var sfit = seasonal ? inSeason / seasonal : 0.5;
    if (seasonal && sfit >= 0.99) add(4, 'good', '제철 재료로 만들었다');
    else if (seasonal && sfit === 0) add(-4, 'bad', '제철이 아닌 재료라 맛이 덜 오르고 비싸다');
    if (spec.classic) add(D.R.classicBonus, 'good', '검증된 정통 레시피');
    q = Math.round(clamp(q, 0, 100));

    var colList = Object.keys(cols).sort(function (a, b) { return cols[b] - cols[a]; });
    var domAro = Object.keys(aro).sort(function (a, b) { return aro[b] - aro[a]; })[0] || null;
    return {
      id: spec.id || null, n: spec.n, cu: spec.cu || 'fu', co: spec.co, te: spec.te, i: ids.slice(),
      t: t, pt: pt, aro: Object.keys(aro), domAro: domAro, tex: Object.keys(tex), temp: temp,
      w: r1(w), col: colList.slice(0, 3), main: ids[0] || null, amt: parts.map(function (p) { return p[1]; }), cat: main.c,
      cost: Math.round(cost), price: Math.ceil(cost / D.R.foodCostRate / 1000) * 1000,
      q: q, notes: notes, syn: syn, veg: !nonveg, sfit: sfit,
      nut: { protein: hasProtein, veg: hasVeg, carb: hasCarb }
    };
  };

  /* 레시피 id → 프로필 (계절별 캐시 없이 매번 계산: 데이터가 작아 충분히 빠름) */
  CK.recipeProfile = function (D, id, season) {
    var r = D.rec[id];
    return CK.profile(D, { id: id, n: r.n, cu: r.cu, co: r.co, te: r.te, i: r.i, temp: r.temp, x: r.x, classic: true }, season);
  };
})(typeof window !== 'undefined' ? window : global);
</script>
<script>
/* 식단(메뉴) 평가 — 코스 / 한식 반상.  evalMenu(D, profiles[], format, season) → {score, grade, sub[], notes[], perfect}
   profiles 는 CK.profile 결과(순서 = 내는 순서). */
(function (root) {
  'use strict';
  var CK = root.CK = root.CK || {};
  var clamp = CK.clamp;
  // 코스의 정석 순서 (식사(staple)는 앞뒤로 유연)
  var ORDER = { amuse: 0, app: 1, soup: 2, salad: 2.5, fish: 3, staple: 3.5, cleanser: 4, main: 5, banchan: 5, rice: 5.5, guk: 5.5, kimchi: 5.5, dessert: 7 };
  var OBANG = { green: '청', red: '적', pink: '적', orange: '황', yellow: '황', white: '백', black: '흑', brown: '흑', purple: '흑' };
  var MEATCAT = { beef: 1, pork: 1, lamb: 1, poultry: 1 }, SEACAT = { fish: 1, shellfish: 1 };
  var GROUPN = { '생채': '생채(날것·초절임)', '숙채': '숙채(나물)', '구이': '구이', '조림': '조림', '전': '전', '볶음': '볶음', '찜': '찜', '튀김': '튀김', '수육': '수육', '김치·젓갈': '젓갈·발효', '국': '국', '찌개': '찌개', '후식': '후식' };

  function grade(s) { return s >= 92 ? 'S' : s >= 82 ? 'A' : s >= 70 ? 'B' : s >= 55 ? 'C' : 'D'; }
  CK.grade = grade;
  function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; }

  function Ctx() { this.notes = []; }
  Ctx.prototype.n = function (k, cat, t) { this.notes.push({ k: k, c: cat, t: t }); };

  function common(D, P, season, ctx, sub) {
    // 맛 균형: 각 요리 완성도 + 메뉴 전체 맛 분포
    var qAvg = avg(P.map(function (p) { return p.q; }));
    var s = qAvg;
    var savory = P.filter(function (p) { return p.co !== 'dessert' && p.co !== 'cleanser'; });
    var salty = avg(savory.map(function (p) { return p.pt.salty; }));
    if (savory.length >= 3 && salty > 3.2) { s -= 10; ctx.n('bad', '맛', '메뉴 전체가 짜다 (평균 짠맛 ' + salty.toFixed(1) + ') — 담백한 요리로 쉬어 가자'); }
    var spicyN = savory.filter(function (p) { return p.pt.spicy >= 2.3; }).length;
    if (savory.length >= 3 && spicyN / savory.length > 0.5) { s -= 10; ctx.n('bad', '맛', '매운 요리가 절반이 넘는다 — 혀가 지쳐 다른 맛을 못 느낀다 (매운맛은 통증)'); }
    else if (spicyN >= 1 && spicyN < savory.length) ctx.n('good', '맛', '매운 요리와 순한 요리가 섞여 있다');
    if (!P.some(function (p) { return p.pt.sour >= 1.5; })) { s -= 8; ctx.n('bad', '맛', '메뉴에 산미가 하나도 없다 — 새콤한 요리가 전체를 밝게 만든다'); }
    if (P.some(function (p) { return p.syn; })) ctx.n('good', '맛', '감칠맛 상승효과를 쓴 요리가 있다');
    P.forEach(function (p) { if (p.q < 60) ctx.n('bad', '맛', '「' + p.n + '」 완성도가 낮다 (' + p.q + '점): ' + ((p.notes.filter(function (x) { return x.k === 'bad'; })[0] || {}).t || '')); });
    if (P.some(function (p) { return p.notes.some(function (x) { return x.t.indexOf('식중독') === 0; }); })) { s -= 40; ctx.n('bad', '맛', '식중독 위험 요리가 있다! 손님에게 낼 수 없다'); }
    sub.push({ k: 'taste', n: '맛 균형', s: clamp(s, 0, 100) });

    // 계절감
    var sf = avg(P.map(function (p) { return p.sfit; }));
    var ss = clamp(30 + sf * 80, 0, 100);
    if (sf >= 0.75) ctx.n('good', '계절', D.R.seasons[season] + ' 제철 재료가 잘 쓰였다');
    else if (sf < 0.35) ctx.n('tip', '계절', D.R.seasons[season] + '에는 제철 재료를 더 써 보자 (상점 → 제철 재료)');
    sub.push({ k: 'season', n: '계절감', s: ss });

    // 영양
    var nu = { protein: 0, veg: 0, carb: 0 };
    P.forEach(function (p) { if (p.nut.protein) nu.protein++; if (p.nut.veg) nu.veg++; if (p.nut.carb) nu.carb++; });
    var ns = 100;
    if (!nu.protein) { ns -= 35; ctx.n('bad', '영양', '단백질 요리가 없다'); }
    if (!nu.carb) { ns -= 20; ctx.n('bad', '영양', '탄수화물(밥·면·빵)이 없다 — 든든함이 부족하다'); }
    if (nu.veg < Math.max(1, Math.round(P.length / 3))) { ns -= 25; ctx.n('bad', '영양', '채소 요리가 부족하다'); }
    if (ns === 100) ctx.n('good', '영양', '단백질·탄수화물·채소가 고루 있다');
    sub.push({ k: 'nut', n: '영양', s: clamp(ns, 0, 100) });
  }

  function evalCourse(D, P, season) {
    var ctx = new Ctx(), sub = [], n = P.length, i;
    // 1. 구성
    var s = 100;
    if (n < D.R.courseMin) { s -= 40; ctx.n('bad', '구성', '코스는 최소 ' + D.R.courseMin + '접시가 필요하다'); }
    if (n > 8) { s -= 10; ctx.n('bad', '구성', '접시가 너무 많아 손님이 지친다'); }
    var centerIdx = -1;
    P.forEach(function (p, k) { if (p.co === 'main') centerIdx = k; });
    if (centerIdx < 0) P.forEach(function (p, k) { if (p.co === 'fish' || p.co === 'staple') centerIdx = k; });
    if (centerIdx < 0) { s -= 30; ctx.n('bad', '구성', '코스의 중심(메인·생선·식사)이 없다'); }
    var last = P[n - 1];
    if (last && last.co === 'dessert') ctx.n('good', '구성', '디저트로 마무리한다');
    else { s -= 30; ctx.n('bad', '구성', '마지막은 디저트(또는 단 것)로 끝내는 것이 정석'); }
    var dIdx = P.map(function (p) { return p.co; }).indexOf('dessert');
    if (dIdx >= 0 && dIdx < n - 1 && P.slice(dIdx + 1).some(function (p) { return p.co !== 'dessert' && p.co !== 'cleanser'; })) { s -= 20; ctx.n('bad', '구성', '디저트 뒤에 짠 요리가 나온다'); }
    var inv = 0;
    for (i = 1; i < n; i++) if ((ORDER[P[i].co] || 0) + 0.6 < (ORDER[P[i - 1].co] || 0)) inv++;
    if (inv) { s -= inv * 10; ctx.n('bad', '구성', '순서가 어긋난 곳이 ' + inv + '곳 (정석: 아뮤즈 → 전채 → 수프 → 생선 → 입가심 → 메인 → 디저트)'); }
    if (P[0] && (P[0].co === 'amuse' || P[0].co === 'app')) ctx.n('good', '구성', '가벼운 한 입으로 시작한다');
    var mains = P.filter(function (p) { return p.co === 'main'; }).length;
    if (mains > 2) { s -= 20; ctx.n('bad', '구성', '메인이 ' + mains + '개 — 주인공이 너무 많다'); }
    sub.push({ k: 'struct', n: '코스 구성', s: clamp(s, 0, 100) });

    // 2. 흐름(무게감)
    s = 100;
    if (P[0] && P[0].w >= 3.5) { s -= 20; ctx.n('bad', '흐름', '첫 접시(' + P[0].n + ')가 너무 묵직하다 — 식욕을 여는 가벼운 것으로'); }
    for (i = 1; i < n; i++) if (P[i].w >= 3.6 && P[i - 1].w >= 3.6) { s -= 15; ctx.n('bad', '흐름', '「' + P[i - 1].n + '」→「' + P[i].n + '」 무거운 요리가 연달아 나온다'); }
    if (centerIdx >= 0) {
      var peak = P[centerIdx].w, up = 0, upn = 0;
      for (i = 1; i <= centerIdx; i++) { if (P[i].co === 'cleanser') continue; upn++; if (P[i].w >= P[i - 1].w - 0.3) up++; }
      if (upn >= 2 && up / upn >= 0.7) ctx.n('good', '흐름', '무게감이 메인을 향해 차곡차곡 올라간다');
      else if (upn >= 2) { s -= 10; ctx.n('bad', '흐름', '무게감이 오르내린다 — 가벼운 것에서 진한 것으로'); }
      for (i = centerIdx + 1; i < n; i++) if (P[i].co !== 'dessert' && P[i].w > peak + 0.3) { s -= 12; ctx.n('bad', '흐름', '메인보다 무거운 「' + P[i].n + '」이(가) 뒤에 나온다'); }
    }
    if (last && last.co === 'dessert' && last.w >= 4) { s -= 10; ctx.n('bad', '흐름', '디저트가 너무 무겁다 — 배부른 손님에게는 가벼운 마무리'); }
    sub.push({ k: 'flow', n: '흐름', s: clamp(s, 0, 100) });

    common(D, P, season, ctx, sub);

    // 반복 피하기
    s = 100;
    var catCount = {}, techCount = {};
    for (i = 0; i < n; i++) {
      var p = P[i];
      if (p.co !== 'dessert' && p.co !== 'cleanser') catCount[p.cat] = (catCount[p.cat] || 0) + 1;
      techCount[p.te] = (techCount[p.te] || 0) + 1;
      if (i && p.co !== 'dessert' && P[i - 1].cat === p.cat && P[i - 1].co !== 'dessert') { s -= 15; ctx.n('bad', '반복', '「' + P[i - 1].n + '」→「' + p.n + '」 같은 주재료(' + (D.cats[p.cat] || p.cat) + ')가 연달아 나온다'); }
      if (i && P[i - 1].te === p.te) { s -= 10; ctx.n('bad', '반복', '같은 조리법(' + D.tech[p.te].n + ')이 연달아 나온다'); }
      if (i && p.domAro && P[i - 1].domAro === p.domAro && p.co !== 'dessert') { s -= 5; ctx.n('tip', '반복', '「' + p.n + '」 앞 접시와 같은 향(' + CK.AK[p.domAro] + ')이 주도한다'); }
    }
    Object.keys(catCount).forEach(function (c) { if (catCount[c] >= 3) { s -= 10; ctx.n('bad', '반복', D.cats[c] + ' 요리가 ' + catCount[c] + '번이나 나온다'); } });
    var techN = Object.keys(techCount).length;
    if (n >= 4 && techN >= n - 1) ctx.n('good', '반복', '조리법이 ' + techN + '가지로 다채롭다');
    sub.push({ k: 'variety', n: '다양성', s: clamp(s, 0, 100) });

    // 질감·온도
    s = 60;
    var texAll = {};
    P.forEach(function (p) { p.tex.forEach(function (x) { texAll[x] = 1; }); });
    var texN = Object.keys(texAll).length;
    s += Math.min(30, texN * 5);
    if (texAll.crispy || texAll.crunchy) ctx.n('good', '질감', '바삭·아삭한 식감이 있다'); else { s -= 12; ctx.n('bad', '질감', '바삭하거나 아삭한 것이 하나도 없다 — 입이 심심하다'); }
    var hot = P.some(function (p) { return p.temp === 'hot' || p.temp === 'warm'; }), cold = P.some(function (p) { return p.temp === 'cold' || p.temp === 'room'; });
    if (hot && cold) { s += 10; ctx.n('good', '온도', '뜨거운 것과 차가운 것이 번갈아 나온다'); } else { s -= 10; ctx.n('bad', '온도', '온도 대비가 없다 (모두 ' + (hot ? '뜨겁다' : '차갑다') + ')'); }
    sub.push({ k: 'texture', n: '질감·온도', s: clamp(s, 0, 100) });

    // 색감
    var colAll = {};
    P.forEach(function (p) { p.col.forEach(function (c) { colAll[c] = 1; }); });
    var cN = Object.keys(colAll).length;
    s = clamp(30 + cN * 12, 0, 100);
    if (cN >= 5) ctx.n('good', '색', '색이 다채롭다 (' + Object.keys(colAll).map(function (c) { return CK.COLK[c]; }).join('·') + ')');
    else if (cN <= 3) ctx.n('bad', '색', '색이 단조롭다 — 초록 채소나 붉은 재료로 생기를');
    sub.push({ k: 'color', n: '색감', s: s });

    // 조화(문화권·향 연결) + 입가심
    s = 70;
    var cuC = {};
    P.forEach(function (p) { cuC[p.cu] = (cuC[p.cu] || 0) + 1; });
    var cuTop = Object.keys(cuC).sort(function (a, b) { return cuC[b] - cuC[a]; })[0];
    var cuShare = cuC[cuTop] / n, cuN = Object.keys(cuC).length;
    if (cuShare >= 0.7) { s += 15; ctx.n('good', '조화', D.cuisines[cuTop] + ' 콘셉트가 일관된다'); }
    else if (cuN >= 4) { s -= 15; ctx.n('bad', '조화', cuN + '개 나라 요리가 섞여 콘셉트가 흐릿하다'); }
    var bridge = 0;
    for (i = 1; i < n; i++) if (P[i].aro.some(function (a) { return P[i - 1].aro.indexOf(a) >= 0 && a !== P[i - 1].domAro; })) bridge++;
    if (n > 1 && bridge / (n - 1) >= 0.5) { s += 10; ctx.n('good', '조화', '앞뒤 접시가 공통 향으로 자연스럽게 이어진다'); }
    for (i = 0; i < n - 1; i++) {
      if (P[i].t.fat >= 3 && P[i].co !== 'dessert') {
        var nx = P[i + 1];
        if (nx.co === 'cleanser' || nx.pt.sour >= 1.5) { s += 6; ctx.n('good', '입가심', '기름진 「' + P[i].n + '」 뒤에 새콤한 「' + nx.n + '」로 입을 씻는다'); }
        else if (nx.t.fat >= 3 && nx.co !== 'dessert') { s -= 8; ctx.n('tip', '입가심', '「' + P[i].n + '」 다음에 입가심(셔벗·초절임)을 넣어 보자'); }
      }
    }
    sub.push({ k: 'harmony', n: '조화·연결', s: clamp(s, 0, 100) });
    return finish(sub, ctx, { struct: 14, flow: 14, taste: 20, variety: 14, texture: 10, color: 6, harmony: 10, season: 6, nut: 6 });
  }

  function evalBansang(D, P, season) {
    var ctx = new Ctx(), sub = [];
    var role = function (p) {
      if (p.co === 'rice') return 'rice';
      if (p.co === 'guk' || p.co === 'soup') return 'guk';
      if (p.co === 'kimchi') return 'kimchi';
      if (p.co === 'dessert' || p.co === 'cleanser') return 'after';
      return 'chan';
    };
    var R = { rice: [], guk: [], kimchi: [], chan: [], after: [] };
    P.forEach(function (p) { R[role(p)].push(p); });
    var s = 100;
    if (!R.rice.length) { s -= 35; ctx.n('bad', '구성', '밥이 없다 — 반상의 중심은 밥'); }
    if (!R.guk.length) { s -= 25; ctx.n('bad', '구성', '국이나 찌개가 없다'); }
    if (!R.kimchi.length) { s -= 25; ctx.n('bad', '구성', '김치가 없다'); }
    if (R.rice.length > 1) { s -= 10; ctx.n('bad', '구성', '밥이 두 가지다'); }
    if (R.guk.length > 2) { s -= 10; ctx.n('bad', '구성', '국물 요리가 너무 많다'); }
    var cheop = R.chan.length;
    var cheopName = cheop >= 12 ? '12첩(수라상)' : cheop >= 9 ? '9첩' : cheop >= 7 ? '7첩' : cheop >= 5 ? '5첩' : cheop >= 3 ? '3첩' : (cheop + '찬');
    if (cheop < 3) { s -= 25; ctx.n('bad', '구성', '반찬이 ' + cheop + '가지 — 최소 3첩(반찬 3가지)은 차리자'); }
    else ctx.n('good', '구성', cheopName + ' 반상');
    if (R.after.length) ctx.n('good', '구성', '후식(' + R.after.map(function (p) { return p.n; }).join(', ') + ')까지 낸다');
    sub.push({ k: 'struct', n: '기본 구성', s: clamp(s, 0, 100) });

    // 첩수와 조리법
    s = 100;
    var g = {};
    R.chan.forEach(function (p) { var k = D.tech[p.te].g; (g[k] = g[k] || []).push(p.n); });
    Object.keys(g).forEach(function (k) { if (g[k].length >= 2) { s -= 12 * (g[k].length - 1); ctx.n('bad', '조리법', (GROUPN[k] || k) + '이(가) 겹친다: ' + g[k].join(', ')); } });
    var hasNamul = g['숙채'] || g['생채'], hasMainChan = g['구이'] || g['조림'] || g['찜'] || g['수육'] || g['튀김'];
    if (cheop >= 3) {
      if (!hasNamul) { s -= 15; ctx.n('bad', '조리법', '나물(생채·숙채)이 없다 — 3첩부터 기본'); }
      if (!hasMainChan) { s -= 15; ctx.n('bad', '조리법', '구이나 조림이 없다 — 반상의 주찬'); }
      if (hasNamul && hasMainChan) ctx.n('good', '조리법', '나물과 주찬(구이·조림)이 갖춰졌다');
    }
    if (cheop >= 5 && !g['전']) { s -= 8; ctx.n('tip', '조리법', '5첩 이상이면 전이 하나 있으면 좋다'); }
    if (Object.keys(g).length >= Math.min(cheop, 5) && cheop >= 3) ctx.n('good', '조리법', '반찬 조리법이 ' + Object.keys(g).length + '가지로 겹치지 않는다');
    sub.push({ k: 'variety', n: '첩수·조리법', s: clamp(s, 0, 100) });

    common(D, P, season, ctx, sub);
    var gukSpicy = R.guk.some(function (p) { return p.pt.spicy >= 2; });
    var mild = R.chan.filter(function (p) { return p.pt.spicy < 1 && p.pt.salty < 2.6; }).length;
    if (R.chan.length && !mild) ctx.n('bad', '맛', '맵거나 짜지 않은 담백한 반찬이 하나는 있어야 한다');
    if (gukSpicy && R.kimchi.length && R.chan.filter(function (p) { return p.pt.spicy >= 2; }).length >= 2) ctx.n('tip', '맛', '찌개·김치가 매우니 반찬은 순하게 맞추자');

    // 오방색
    var ob = {};
    P.forEach(function (p) { p.col.forEach(function (c) { if (OBANG[c]) ob[OBANG[c]] = 1; }); });
    var obN = Object.keys(ob).length;
    s = clamp(obN * 20, 0, 100);
    if (obN === 5) ctx.n('good', '오방색', '청·적·황·백·흑 오방색이 모두 담겼다');
    else ctx.n('tip', '오방색', '빠진 색: ' + ['청', '적', '황', '백', '흑'].filter(function (c) { return !ob[c]; }).join('·') + ' (오방색)');
    sub.push({ k: 'color', n: '오방색', s: s });

    // 재료 다양성 (육·해·채)
    s = 100;
    var cc = {};
    R.chan.concat(R.guk).forEach(function (p) { cc[p.cat] = (cc[p.cat] || 0) + 1; });
    Object.keys(cc).forEach(function (c) { if (cc[c] >= 2 && !/^(veg|leafy|root)$/.test(c)) { s -= 12 * (cc[c] - 1); ctx.n('bad', '재료', D.cats[c] + ' 주재료가 ' + cc[c] + '번 겹친다'); } });
    var meat = P.some(function (p) { return MEATCAT[p.cat]; }), sea = P.some(function (p) { return SEACAT[p.cat]; }), veg = R.chan.some(function (p) { return /^(veg|leafy|root|mushroom|seaweed|legume)$/.test(p.cat); });
    if (meat && sea && veg) { s += 0; ctx.n('good', '재료', '육(고기)·해(해산물)·채(채소)가 고루 있다'); }
    else { s -= 15; ctx.n('tip', '재료', '빠진 쪽: ' + [meat ? '' : '고기', sea ? '' : '해산물', veg ? '' : '채소'].filter(Boolean).join('·')); }
    var temps = {};
    P.forEach(function (p) { temps[p.temp] = 1; });

<script>
/* 게임 상태와 행동(apply) — 식당 운영 규칙. 무작위는 상태 안의 씨앗(S.rng)만 쓴다. */
(function (root) {
  'use strict';
  var CK = root.CK = root.CK || {};
  var clamp = CK.clamp;

  function rnd(S) { // mulberry32
    var t = (S.rng = (S.rng + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  CK.rnd = rnd;

  CK.newGame = function (D, seed) {
    var R = D.R, S = {
      v: 1, rng: (seed >>> 0) || 1, day: 1, money: R.startMoney, rep: R.startRep, stars: 0, seats: R.startSeats,
      known: {}, books: {}, equip: {}, custom: {}, nextCid: 1, found: {},
      menu: { format: 'course', items: [] }, priceRate: 1.0, skill: {},
      stats: { served: 0, revenue: 0, profit: 0, bestScore: 0, perfect: 0, critic: [] },
      last: null, rumor: null, over: false, name: '나의 작은 식당'
    };
    D.recIds.forEach(function (id) { if (D.rec[id].src === 'start') S.known[id] = 1; });
    S.menu.items = ['r:jeyuk', 'r:bulgogi', 'r:tteokbokki'];
    return S;
  };

  CK.season = function (D, S) { return Math.floor((S.day - 1) / D.R.seasonDays) % 4; };
  CK.techOpen = function (D, S, te) { var t = D.tech[te]; return !!t && (!t.eq || !!S.equip[t.eq]); };
  CK.level = function (D, S, te) { return Math.min(D.R.skillMax, Math.floor(Math.sqrt((S.skill[te] || 0) / D.R.skillXpPerLevel))); };
  CK.execRate = function (D, S, te) { return D.R.skillBase + D.R.skillPerLevel * CK.level(D, S, te); };

  CK.dish = function (D, S, ref, season) {
    if (season == null) season = CK.season(D, S);
    var k = ref.slice(0, 2), id = ref.slice(2);
    if (k === 'r:' && D.rec[id]) return CK.recipeProfile(D, id, season);
    if (k === 'c:' && S.custom[id]) { var c = S.custom[id]; var p = CK.profile(D, { id: ref, n: c.n, cu: 'fu', co: c.co, te: c.te, i: c.i }, season); p.custom = true; return p; }
    return null;
  };
  CK.menuProfiles = function (D, S, season) {
    return S.menu.items.map(function (r) { return CK.dish(D, S, r, season); }).filter(Boolean);
  };
  CK.evalCurrent = function (D, S) { var s = CK.season(D, S); return CK.evalMenu(D, CK.menuProfiles(D, S, s), S.menu.format, s); };
  CK.menuPrice = function (D, S) {
    var P = CK.menuProfiles(D, S), base = 0, cost = 0;
    P.forEach(function (p) { base += p.price; cost += p.cost; });
    return { base: base, cost: cost, price: Math.round(base * S.priceRate / 100) * 100 };
  };
  /* 연구실: 만든 요리의 코스 종류 추측 */
  CK.guessCourse = function (p) {
    if (p.pt.sweet >= 2.5 && p.pt.salty < 1.3) return p.temp === 'cold' && p.pt.sour >= 1.5 && p.t.fat < 1 ? 'cleanser' : 'dessert';
    if (p.tex.indexOf('brothy') >= 0) return 'soup';
    if (p.nut.carb && (p.cat === 'grain' || p.cat === 'noodle' || p.cat === 'bread')) return 'staple';
    if (p.cat === 'fish' || p.cat === 'shellfish') return 'fish';
    if (p.w >= 3) return 'main';
    if (p.w <= 1.6 && !p.nut.protein) return 'salad';
    return 'app';
  };
  function findRecipe(D, te, ids) {
    var best = null;
    D.recIds.forEach(function (id) {
      var r = D.rec[id];
      if (r.te !== te) return;
      var ri = CK.ids(r.i);
      if (!ri.every(function (x) { return ids.indexOf(x) >= 0; })) return;
      if (ids.length - ri.length > 1) return;
      if (!best || ri.length > CK.ids(D.rec[best].i).length) best = id;
    });
    return best;
  }
  function hint(D, S, te, ids) {
    var best = null, bs = 0;

    });
    if (!best || bs < 0.45) return null;
    var r = D.rec[best], ri = CK.ids(r.i), miss = ri.filter(function (x) { return ids.indexOf(x) < 0; });
    var extra = ids.filter(function (x) { return ri.indexOf(x) < 0; });
    if (r.te !== te && !miss.length) return '이 재료라면 「' + D.tech[r.te].n + '」으로 만들어 보면 어떨까?';
    var t = '어딘가 익숙한 맛… ' + D.cuisines[r.cu] + ' 요리가 될 것 같다. ';
    if (miss.length) t += '재료가 ' + miss.length + '가지 부족하다 (예: ' + D.cats[D.ing[miss[0]].c] + ' 종류)';
    if (extra.length > 1) t += ' · 필요 없는 재료가 ' + (extra.length - 1) + '가지 섞였다';
    if (r.te !== te) t += ' · 조리법도 다른 것 같다';
    return t;
  }

  function pick(S, arr) { return arr[Math.floor(rnd(S) * arr.length)]; }

  CK.apply = function (D, S, a) {
    var R = D.R, x;
    if (S.over && a.type !== 'rename') return { ok: false, err: '파산했습니다. 새 게임을 시작하세요.' };
    switch (a.type) {
      case 'rename': S.name = String(a.name || '').slice(0, 20) || S.name; return { ok: true };
      case 'buyBook':
        x = D.books[a.id];
        if (!x) return { ok: false, err: '없는 책' };
        if (S.books[a.id]) return { ok: false, err: '이미 가진 책' };
        if (x.req && x.req.rep > S.rep) return { ok: false, err: '평판 ' + x.req.rep + ' 이상 필요' };
        if (S.money < x.price) return { ok: false, err: '돈이 부족합니다' };
        S.money -= x.price; S.books[a.id] = 1;
        var got = [];
        D.recIds.forEach(function (id) { if (D.rec[id].src === a.id && !S.known[id]) { S.known[id] = 1; got.push(id); } });
        return { ok: true, res: { got: got } };
      case 'buyEquip':
        x = D.equip[a.id];
        if (!x) return { ok: false, err: '없는 설비' };
        if (S.equip[a.id]) return { ok: false, err: '이미 있음' };
        if (x.req && x.req.rep > S.rep) return { ok: false, err: '평판 ' + x.req.rep + ' 이상 필요' };
        if (x.req && x.req.equip && !S.equip[x.req.equip]) return { ok: false, err: D.equip[x.req.equip].n + ' 먼저 필요' };
        if (S.money < x.price) return { ok: false, err: '돈이 부족합니다' };
        S.money -= x.price; S.equip[a.id] = 1;
        if (x.seats) S.seats = x.seats;
        return { ok: true };
      case 'cook': {
        var ids = CK.ids(a.i || []);
        if (!ids.length) return { ok: false, err: '재료를 고르세요' };
        if (ids.length > R.maxLabIngredients) return { ok: false, err: '재료는 ' + R.maxLabIngredients + '가지까지' };
        if (ids.some(function (i, k) { return !D.ing[i] || ids.indexOf(i) !== k; })) return { ok: false, err: '재료가 잘못됨' };
        if (!CK.techOpen(D, S, a.te)) return { ok: false, err: '이 조리법에는 설비가 필요합니다' };
        var season = CK.season(D, S);
        var probe = CK.profile(D, { n: '?', co: a.co || 'app', te: a.te, i: a.i }, season);
        var labCost = Math.round(probe.cost);
        if (S.money < labCost) return { ok: false, err: '재료비가 부족합니다' };
        S.money -= labCost;
        var rid = findRecipe(D, a.te, ids);
        if (rid) {
          var isNew = !S.known[rid];
          S.known[rid] = 1;
          if (isNew) S.found[rid] = S.day;
          return { ok: true, res: { kind: isNew ? 'found' : 'known', id: rid, p: CK.recipeProfile(D, rid, season), cost: labCost } };
        }
        var co = a.co || CK.guessCourse(probe);
        var p = CK.profile(D, { n: '?', co: co, te: a.te, i: a.i }, season);
        var main = D.ing[ids[0]];
        var name = a.n || (main.n + ' ' + D.tech[a.te].n.split(/[·(]/)[0]);
        var cid = null;
        if (Object.keys(S.custom).length < R.maxCustom && a.save !== false) {

          S.custom[cid] = { n: name, co: co, te: a.te, i: a.i.slice(), day: S.day, q: p.q };
        }
        p.n = name;
        return { ok: true, res: { kind: 'custom', cid: cid, p: p, hint: hint(D, S, a.te, ids), cost: labCost } };
      }
      case 'renameCustom':
        if (!S.custom[a.cid]) return { ok: false, err: '없음' };
        S.custom[a.cid].n = String(a.n || '').slice(0, 24) || S.custom[a.cid].n; return { ok: true };
      case 'setCustomCourse':
        if (!S.custom[a.cid] || !D.courses[a.co]) return { ok: false, err: '없음' };
        S.custom[a.cid].co = a.co; return { ok: true };
      case 'delCustom':
        if (!S.custom[a.cid]) return { ok: false, err: '없음' };
        delete S.custom[a.cid];
        S.menu.items = S.menu.items.filter(function (r) { return r !== 'c:' + a.cid; });
        return { ok: true };
      case 'setMenu': {
        var f = a.format === 'bansang' ? 'bansang' : 'course';
        var max = f === 'bansang' ? R.bansangMax : R.courseMax;
        var items = (a.items || []).filter(function (r) { var k = r.slice(2); return r.indexOf('r:') === 0 ? S.known[k] : !!S.custom[k]; });
        if (items.length > max) return { ok: false, err: '최대 ' + max + '가지' };
        var techBad = items.filter(function (r) { var d = CK.dish(D, S, r); return d && !CK.techOpen(D, S, d.te); });
        if (techBad.length) return { ok: false, err: '설비가 없어 만들 수 없는 요리가 있습니다' };
        S.menu = { format: f, items: items };
        return { ok: true };
      }
      case 'setPrice': S.priceRate = clamp(Math.round(+a.rate * 100) / 100 || 1, R.priceRateMin, R.priceRateMax); return { ok: true };
      case 'runDay': return runDay(D, S);
    }
    return { ok: false, err: '알 수 없는 행동' };
  };

  function prefScore(D, cust, P, ev) {
    var n = P.length, f = {}, like = cust.like || {}, sum = 0, ws = 0;
    CK.TN.forEach(function (t) { f['taste:' + t] = P.reduce(function (s, p) { return s + p.pt[t]; }, 0) / n / 5; });
    var cu = {}, tx = {};
    P.forEach(function (p) { cu['cu:' + p.cu] = (cu['cu:' + p.cu] || 0) + 1 / n; p.tex.forEach(function (x) { tx['x:' + x] = (tx['x:' + x] || 0) + 1 / n; }); });
    var cols = {};
    P.forEach(function (p) { p.col.forEach(function (c) { cols[c] = 1; }); });
    f.light = 1 - P.reduce(function (s, p) { return s + p.w; }, 0) / n / 5;
    f.veg = P.filter(function (p) { return p.veg && p.nut.veg; }).length / n;
    f.color = Math.min(1, Object.keys(cols).length / 7);
    f.dessert = P.some(function (p) { return p.co === 'dessert'; }) ? 1 : 0;
    f.complex = Math.min(1, P.reduce(function (s, p) { return s + p.aro.length; }, 0) / n / 5);
    Object.keys(like).forEach(function (k) {
      var v = f[k] != null ? f[k] : (cu[k] || tx[k] || 0);
      var base = k.indexOf('taste:') === 0 ? 0.3 : 0.35;
      sum += like[k] * (v - base); ws += Math.abs(like[k]);

  }

  function runDay(D, S) {
    var R = D.R, season = CK.season(D, S);
    var P = CK.menuProfiles(D, S, season);
    if (!P.length) return { ok: false, err: '메뉴가 비어 있습니다' };
    if (P.some(function (p) { return !CK.techOpen(D, S, p.te); })) return { ok: false, err: '설비가 없어 만들 수 없는 요리가 있습니다' };
    var ev = CK.evalMenu(D, P, S.menu.format, season);
    var execQ = P.map(function (p) { return clamp(p.q * CK.execRate(D, S, p.te), 0, 100); });
    var avgExec = execQ.reduce(function (a, b) { return a + b; }, 0) / P.length;
    var mp = CK.menuPrice(D, S);
    var dow = ((S.day - 1) % 7) + 1;
    var demand = (R.baseCustomers + S.rep / R.repPerCustomer + S.stars * R.starCustomers) *
      (0.6 + ev.score * 0.006) * clamp(1.3 - 0.3 * S.priceRate, 0.35, 1.2) * (0.85 + rnd(S) * 0.3) * (dow >= 6 ? 1.25 : 1);
    var cap = S.seats * 2;
    var n = Math.max(1, Math.min(cap, Math.round(demand)));
    var types = Object.keys(D.cust).filter(function (k) { return D.cust[k].rep <= S.rep; });
    var tw = types.reduce(function (s, k) { return s + D.cust[k].w; }, 0);
    var rev = 0, cost = 0, repD = 0, served = 0, left = 0, sats = [], reviews = [], byType = {};

      for (var j = 0; j < types.length; j++) { r -= D.cust[types[j]].w; if (r <= 0) { tk = types[j]; break; } }
      var cu = D.cust[tk], mc = cu.mc || 0;
      if (cu.veg_only && vegN === 0) { left++; repD -= 1; if (reviews.length < 6) reviews.push({ who: cu.n, s: 10, t: '먹을 수 있는 요리가 하나도 없었어요…' }); continue; }
      var pref = prefScore(D, cu, P, ev);
      var sat = avgExec * (W.quality - 0.3 * mc) + ev.score * (W.menu + 0.3 * mc) + pref * W.pref;
      if (cu.veg_only) sat -= (1 - vegN / P.length) * 50;
      var val = mp.base * (0.55 + sat / 100 * 0.9) * cu.wealth * (1 + 0.12 * S.stars);
      var why = null;
      if (mp.price > val) { sat -= Math.min(40, (mp.price / val - 1) * 70); why = 'price'; }
      else if (mp.price < val * 0.75) sat += 4;
      sat = clamp(sat + (rnd(S) * 2 - 1) * R.noise, 0, 100);
      served++; rev += mp.price; cost += mp.cost; sats.push(sat);
      repD += (sat - 65) * R.repGainRate * (tk === 'foodie' ? 2 : 1);
      byType[tk] = (byType[tk] || 0) + 1;
      if (reviews.length < 6 && rnd(S) < 0.35) {
        var t;
        if (sat >= 78) t = pick(S, cu.say);
        else if (why === 'price') t = '맛은 괜찮은데 이 가격은 좀…';
        else if (sat < 55) { var bad = ev.notes.filter(function (x) { return x.k === 'bad'; }); t = bad.length ? '아쉬워요. ' + pick(S, bad).t : '그저 그랬어요'; }
        else t = pref < 45 ? '제 입맛엔 조금 안 맞았어요' : '무난했어요';
        reviews.push({ who: cu.n, s: Math.round(sat), t: t });
      }
    }
    P.forEach(function (p) { S.skill[p.te] = (S.skill[p.te] || 0) + served; });
    var labor = Math.round(rev * R.laborRate);
    var fixed = R.fixedCostPerDay + S.seats * 3000 + labor;
    var profit = rev - cost - fixed;
    S.money += profit;
    var critic = null;
    if (S.day % R.criticEvery === 0) {
      var cs = Math.round(0.5 * ev.score + 0.5 * avgExec);
      var st = R.criticStars.filter(function (v) { return cs >= v; }).length;
      var prev = S.stars;
      S.stars = st;
      repD += (cs - 70) * 1.5;
      var good = ev.notes.filter(function (x) { return x.k === 'good'; }), badn = ev.notes.filter(function (x) { return x.k === 'bad'; });
      critic = { score: cs, stars: st, prev: prev, good: good.slice(0, 3).map(function (x) { return x.t; }), bad: badn.slice(0, 3).map(function (x) { return x.t; }) };
      S.stats.critic.push({ day: S.day, score: cs, stars: st });
    }
    var avgSat = sats.length ? sats.reduce(function (a, b) { return a + b; }, 0) / sats.length : 0;
    S.rep = clamp(Math.round(S.rep + repD), 0, 1000);
    S.stats.served += served; S.stats.revenue += rev; S.stats.profit += profit;
    S.stats.bestScore = Math.max(S.stats.bestScore, ev.score);
    if (ev.perfect) S.stats.perfect++;
    var res = { day: S.day, season: season, n: n, served: served, left: left, cap: cap, price: mp.price, rev: rev, cost: cost, fixed: fixed, labor: labor, profit: profit,
      repD: Math.round(repD), rep: S.rep, sat: Math.round(avgSat), score: ev.score, grade: ev.grade, exec: Math.round(avgExec), reviews: reviews, critic: critic, byType: byType };
    S.last = res;
    S.day++;
    var unknown = D.recIds.filter(function (id) { return !S.known[id]; });
    S.rumor = unknown.length ? pick(S, unknown) : null;
    if (S.money < -1000000) S.over = true;
    return { ok: true, res: res };
  }
})(typeof window !== 'undefined' ? window : global);

(function () {

    m.addEventListener('click', function (e) { if (e.target === m) closeModal(); });

  }
  function closeModal() { var m = $('#modal'); if (m) m.remove(); }

  /* ---------- 공용 그림 조각 ---------- */

      (p.id && D.rec[p.id] ? '<p class="muted">' + esc(D.rec[p.id].d) + '</p>' : '') +
      '<h3>재료</h3><div class="muted">' + ing + '</div>' +
      '<h3>느껴지는 맛</h3>' + tasteBars(p.pt) +

      p.tex.map(function (x) { return '<span class="tag">' + (CK.XK[x] || x) + '</span>'; }).join('') + '</div><div>' +
      p.col.map(function (c) { return '<span class="dot" style="background:' + COLHEX[c] + '"></span>' + CK.COLK[c] + ' '; }).join('') + '</div>' +
      '<h3>평가</h3>' + notesHtml(p.notes) +
      '<h3>조리 과학 — ' + tech.n + '</h3><p class="muted">' + esc(tech.sci) + '</p>' +
      '<p class="muted">1인분 원가 ' + won(p.cost) + ' · 권장가 ' + won(p.price) + ' (원가율 30%)</p>' + (extra || '');
  }

  /* ---------- 머리·탭 ---------- */

  }
  var TABS = [['home', '🏠', '식당'], ['menu', '🍽️', '메뉴'], ['lab', '🧪', '연구실'], ['book', '📖', '도감'], ['shop', '🛒', '상점']];

  /* ---------- 식당 ---------- */
  function home() {

    var h = '';
    if (S.over) h += '<div class="card"><h2>파산했습니다 😢</h2><p>빚이 100만 원을 넘었습니다. 새로 시작해 보세요.</p><button class="btn pri big" data-a="newgame">새 게임</button></div>';
    var dow = ((S.day - 1) % 7) + 1;
    h += '<div class="card hl"><div class="row"><div class="sp"><div class="muted">오늘의 메뉴 · ' + (S.menu.format === 'bansang' ? '한식 반상' : '코스') + '</div><div style="font-weight:700">' + (P.map(function (p) { return esc(p.n); }).join(' → ') || '비어 있음') + '</div></div><div class="grade g-' + ev.grade + '" style="background:rgba(255,255,255,.25)">' + ev.grade + '</div></div>' +
      '<div class="muted" style="margin-top:6px">식단 점수 ' + ev.score + '점' + (ev.perfect ? ' · ★ 완벽한 식단' : '') + ' · ' + (dow === 7 ? '오늘 밤 미식 평론가 방문!' : '평론가 방문까지 ' + (7 - dow) + '일') + '</div></div>';
    var rate = Math.round(S.priceRate * 100);
    h += '<div class="card"><h2>가격</h2><div class="row"><div class="sp">1인 <b class="big">' + won(mp.price) + '</b></div><div class="muted">원가 ' + won(mp.cost) + '<br>원가율 ' + (mp.price ? Math.round(mp.cost / mp.price * 100) : 0) + '%</div></div>' +
      '<input type="range" min="' + D.R.priceRateMin * 100 + '" max="' + D.R.priceRateMax * 100 + '" step="5" value="' + rate + '" data-a="price"><div class="muted">권장가의 ' + rate + '% · 비싸면 손님이 줄고 만족도가 떨어지며, 별이 많을수록 비싼 값도 받아들인다</div></div>';
    h += '<button class="btn pri big" data-a="run" ' + (S.over || !P.length ? 'disabled' : '') + '>🔔 영업 시작 (' + S.day + '일차)</button><div style="height:12px"></div>';
    if (S.rumor && D.rec[S.rumor]) { var rr = D.rec[S.rumor]; h += '<div class="card"><h2>💬 오늘의 소문</h2><p style="margin:0">손님들이 「<b>' + esc(rr.n) + '</b>」 이야기를 한다. ' + D.cuisines[rr.cu] + ' 요리이고, <b>' + D.tech[rr.te].n + '</b>(으)로 만든다더라… 주재료는 <b>' + esc(D.ing[CK.ids(rr.i)[0]].n) + '</b>?</p><p class="muted">연구실에서 맞는 재료를 찾아 보세요.</p></div>'; }
    if (S.last) h += lastCard(S.last);
    var used = Object.keys(S.skill);
    h += '<div class="card"><h2>👩‍🍳 셰프 숙련도</h2>' + (used.length ? used.map(function (te) { var lv = CK.level(D, S, te); return '<div class="tb" style="grid-template-columns:110px 1fr 40px"><span>' + D.tech[te].n.split('(')[0] + '</span><div class="bar"><i style="width:' + (lv / 5 * 100) + '%"></i></div><span class="muted">Lv' + lv + '</span></div>'; }).join('') : '<p class="muted">영업할수록 그 조리법이 숙련되어 요리 완성도가 오른다 (Lv0 80% → Lv5 100%)</p>') + '</div>';
    h += '<div class="card"><h2>기록</h2><div class="muted">손님 ' + S.stats.served.toLocaleString() + '명 · 누적 매출 ' + won(S.stats.revenue) + ' · 최고 식단 점수 ' + S.stats.bestScore + ' · 완벽한 식단 ' + S.stats.perfect + '회 · 레시피 ' + Object.keys(S.known).length + '/' + D.recIds.length + '</div>' +
      '<div class="row" style="margin-top:8px"><input type="text" id="rname" value="' + esc(S.name) + '" style="flex:1"><button class="btn sm" data-a="rename">이름 바꾸기</button></div><div style="margin-top:8px"><button class="btn sm" data-a="newgame">새 게임</button> <button class="btn sm" data-a="help">게임 방법</button></div></div>';
    return h;
  }
  function lastCard(r) {

      (r.critic ? '<h3>🎩 미식 평론가 ' + r.critic.score + '점 → ' + ('★★★'.slice(0, r.critic.stars) || '별 없음') + '</h3>' + r.critic.good.map(function (t) { return '<div class="note good">' + esc(t) + '</div>'; }).join('') + r.critic.bad.map(function (t) { return '<div class="note bad">' + esc(t) + '</div>'; }).join('') : '') +
      '<h3>손님 한마디</h3>' + (r.reviews.map(function (v) { return '<div class="note ' + (v.s >= 75 ? 'good' : v.s < 55 ? 'bad' : 'tip') + '"><span class="c">' + esc(v.who) + ' ' + v.s + '</span>' + esc(v.t) + '</div>'; }).join('') || '<p class="muted">—</p>') + '</div>';
  }

  /* ---------- 메뉴 ---------- */
  function menu() {
    var P = CK.menuProfiles(D, S), ev = CK.evalCurrent(D, S);
    var h = '<div class="card"><div class="seg"><button data-a="fmt" data-v="course" class="' + (S.menu.format === 'course' ? 'on' : '') + '">코스 요리</button><button data-a="fmt" data-v="bansang" class="' + (S.menu.format === 'bansang' ? 'on' : '') + '">한식 반상</button></div>' +
      '<p class="muted" style="margin-bottom:0">' + (S.menu.format === 'course' ? '내는 순서대로 놓으세요. 아뮤즈 → 전채 → 수프 → 생선 → 입가심 → 메인 → 디저트가 정석.' : '밥·국·김치 + 반찬(첩). 반찬끼리 조리법·재료가 겹치지 않게, 오방색을 고루.') + '</p></div>';
    h += '<div class="card"><h2>메뉴 (' + P.length + ')</h2><div class="list">' + P.map(function (p, k) {
      return '<div class="it"><div class="sp"><div class="nm" data-a="detail" data-v="' + S.menu.items[k] + '">' + (k + 1) + '. ' + esc(p.n) + '</div><div class="muted">' + D.courses[p.co] + ' · ' + D.tech[p.te].n.split('(')[0] + ' · 무게 ' + p.w + '</div></div><span class="q" style="color:' + qColor(p.q) + '">' + p.q + '</span>' +
        '<button class="btn sm" data-a="mv" data-v="' + k + '" data-d="-1">▲</button><button class="btn sm" data-a="mv" data-v="' + k + '" data-d="1">▼</button><button class="btn sm" data-a="rm" data-v="' + k + '">✕</button></div>';
    }).join('') + '</div><button class="btn pri big" style="margin-top:10px" data-a="pick">＋ 요리 추가</button></div>';
    h += '<div class="card"><div class="row"><div class="grade g-' + ev.grade + '">' + ev.grade + '</div><div class="sp"><div class="big">' + ev.score + '점</div><div class="muted">' + (ev.perfect ? '★ 완벽한 식단!' : 'S등급 + 지적 0개 = 완벽한 식단') + '</div></div></div>' +
      ev.sub.map(function (x) { return '<div class="tb" style="grid-template-columns:84px 1fr 30px"><span>' + x.n + '</span><div class="bar"><i style="width:' + x.s + '%;background:' + (x.s >= 80 ? 'var(--accent2)' : x.s >= 60 ? 'var(--tip)' : 'var(--warn)') + '"></i></div><span class="muted">' + x.s + '</span></div>'; }).join('') +
      '<h3>셰프 노트</h3>' + notesHtml(ev.notes.filter(function (n) { return n.k === 'bad'; }), true) + notesHtml(ev.notes.filter(function (n) { return n.k === 'tip'; }), true) + notesHtml(ev.notes.filter(function (n) { return n.k === 'good'; }), true) + '</div>';
    return h;
  }
  function pickList() {
    var se = season(), out = [];
    Object.keys(S.known).forEach(function (id) { out.push(['r:' + id, CK.recipeProfile(D, id, se)]); });
    Object.keys(S.custom).forEach(function (cid) { out.push(['c:' + cid, CK.dish(D, S, 'c:' + cid, se)]); });
    var q = L.pickQ.trim();
    return out.filter(function (x) { var p = x[1]; return (L.pickCo === 'all' || p.co === L.pickCo) && (!q || p.n.indexOf(q) >= 0); })
      .sort(function (a, b) { return b[1].q - a[1].q; });
  }
  function pickModal() {
    var cos = ['all'].concat(Object.keys(D.courses));
    var items = pickList();
    modal('<h2 style="margin-top:0">요리 추가</h2><input type="search" id="pq" placeholder="이름 검색" value="' + esc(L.pickQ) + '"><div class="scroll-x" style="margin-top:8px">' +
      cos.map(function (c) { return '<span class="chip ' + (L.pickCo === c ? 'on' : '') + '" data-a="pickco" data-v="' + c + '">' + (c === 'all' ? '전체' : D.courses[c]) + '</span>'; }).join('') + '</div><div class="list">' +
      (items.map(function (x) { var p = x[1], ok = CK.techOpen(D, S, p.te); return '<div class="it"><div class="sp"><div class="nm">' + esc(p.n) + (p.custom ? ' <span class="tag">창작</span>' : '') + '</div><div class="muted">' + (D.cuisines[p.cu] || '창작') + ' · ' + D.courses[p.co] + ' · ' + D.tech[p.te].n.split('(')[0] + (ok ? '' : ' 🔒설비 필요') + '</div></div><span class="q" style="color:' + qColor(p.q) + '">' + p.q + '</span><button class="btn sm pri" data-a="add" data-v="' + x[0] + '" ' + (ok ? '' : 'disabled') + '>추가</button></div>'; }).join('') || '<p class="muted">없음</p>') + '</div>');
    var pq = $('#pq'); pq.addEventListener('input', function () { L.pickQ = pq.value; var pos = pq.selectionStart; pickModal(); var n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); });
  }

  function lab() {
    var se = season();
    var h = '<div class="card"><h2>1. 조리법</h2><div>' + Object.keys(D.tech).map(function (te) {
      var ok = CK.techOpen(D, S, te);
      return '<span class="chip ' + (L.labTe === te ? 'on' : '') + (ok ? '' : ' lock') + '" data-a="labte" data-v="' + te + '">' + (ok ? '' : '🔒') + D.tech[te].n + '</span>';
    }).join('') + '</div><p class="muted" style="margin:0">' + esc(D.tech[L.labTe].sci) + '</p></div>';
    h += '<div class="card"><h2>2. 재료 (' + L.labSel.length + '/' + D.R.maxLabIngredients + ')</h2><p class="muted" style="margin-top:0">첫 번째가 주재료. 고른 재료를 누르면 양이 바뀐다 (보통 → 많이 → 조금)</p><div>' +
      (L.labSel.map(function (s, k) { return '<span class="chip on" data-a="amt" data-v="' + k + '">' + (k === 0 ? '★' : '') + esc(D.ing[s.id].n) + (amtName(s.m) ? '·' + amtName(s.m) : '') + ' <b data-a="unsel" data-v="' + k + '">✕</b></span>'; }).join('') || '<span class="muted">아래에서 재료를 고르세요</span>') + '</div>' +
      '<input type="search" id="lq" placeholder="재료 검색 (예: 토마토)" value="' + esc(L.labQ) + '" style="margin-top:6px"><div class="scroll-x" style="margin-top:8px">' +
      ['all'].concat(Object.keys(D.cats)).map(function (c) { return '<span class="chip ' + (L.labCat === c ? 'on' : '') + '" data-a="labcat" data-v="' + c + '">' + (c === 'all' ? '전체' : D.cats[c]) + '</span>'; }).join('') + '</div><div style="max-height:220px;overflow:auto">' +
      Object.keys(D.ing).filter(function (id) { var g = D.ing[id]; return (L.labCat === 'all' || g.c === L.labCat) && (!L.labQ || g.n.indexOf(L.labQ) >= 0) && !L.labSel.some(function (s) { return s.id === id; }); })
        .map(function (id) { var g = D.ing[id], ins = g.s && g.s.indexOf(se) >= 0; return '<span class="chip" data-a="sel" data-v="' + id + '">' + (ins ? '🌱' : '') + esc(g.n) + '</span>'; }).join('') + '</div></div>';
    if (L.labSel.length) {
      var spec = { n: '?', co: L.labCo === 'auto' ? 'app' : L.labCo, te: L.labTe, i: L.labSel.map(function (s) { return s.m === 1 ? s.id : s.id + '*' + s.m; }) };
      var p = CK.profile(D, spec, se);
      var co = L.labCo === 'auto' ? CK.guessCourse(p) : L.labCo;
      h += '<div class="card"><h2>3. 맛 미리보기</h2>' + tasteBars(p.pt) + '<div style="margin-top:6px">' + p.aro.map(function (a) { return '<span class="tag">' + CK.AK[a] + '</span>'; }).join('') + p.tex.map(function (x) { return '<span class="tag">' + (CK.XK[x] || x) + '</span>'; }).join('') + '<span class="tag">' + CK.TEMPK[p.temp] + '</span><span class="tag">무게감 ' + p.w + '</span></div>' +
        '<div class="row" style="margin-top:8px"><span class="muted">코스 종류</span><select id="labco" style="flex:1"><option value="auto">자동 (' + D.courses[co] + ')</option>' + Object.keys(D.courses).map(function (c) { return '<option value="' + c + '" ' + (L.labCo === c ? 'selected' : '') + '>' + D.courses[c] + '</option>'; }).join('') + '</select></div>' +
        '<p class="muted">재료비 ' + won(p.cost) + ' (실험할 때마다 듭니다)</p><button class="btn pri big" data-a="cook" ' + (CK.techOpen(D, S, L.labTe) ? '' : 'disabled') + '>🔥 ' + (CK.techOpen(D, S, L.labTe) ? '조리하기' : '설비가 필요합니다') + '</button></div>';
    }
    return h;
  }
  function cookResult(r) {
    var p = r.p, ex = '';
    if (r.kind === 'found') ex = '<div class="card hl"><h2 style="margin:0">🎉 새 레시피 발견!</h2><div class="muted">도감에 「' + esc(p.n) + '」이(가) 추가되었습니다</div></div>';
    else if (r.kind === 'known') ex = '<div class="card"><b>이미 아는 레시피: ' + esc(p.n) + '</b></div>';
    else ex = '<div class="card"><h2 style="margin:0">창작 요리</h2>' + (r.cid ? '<div class="row" style="margin-top:6px"><input type="text" id="cname" value="' + esc(p.n) + '" style="flex:1"><button class="btn sm" data-a="cname" data-v="' + r.cid + '">이름 저장</button></div>' : '<p class="muted">창작 요리 칸이 가득 찼습니다(도감에서 정리)</p>') + (r.hint ? '<div class="note tip" style="margin-top:6px">' + esc(r.hint) + '</div>' : '') + '</div>';

    modal(ex + dishDetail(p, ref ? '<button class="btn pri big" data-a="addclose" data-v="' + ref + '">메뉴에 추가</button>' : ''));
  }

  /* ---------- 도감 ---------- */
  function book() {

    var se = season();
    if (L.bookTab === 'rec') {
      var kn = Object.keys(S.known).length;
      h += '<div class="card"><h2>레시피 도감 ' + kn + ' / ' + D.recIds.length + '</h2><div class="bar"><i style="width:' + (kn / D.recIds.length * 100) + '%"></i></div><div class="scroll-x" style="margin-top:10px">' +
        ['all'].concat(Object.keys(D.cuisines)).map(function (c) { return '<span class="chip ' + (L.cuF === c ? 'on' : '') + '" data-a="cuf" data-v="' + c + '">' + (c === 'all' ? '전체' : D.cuisines[c]) + '</span>'; }).join('') + '</div><div class="list">' +

          var p = CK.recipeProfile(D, id, se);
          return '<div class="it" data-a="detail" data-v="r:' + id + '"><div class="sp"><div class="nm">' + esc(r.n) + (S.found[id] ? ' <span class="tag">직접 발견</span>' : '') + '</div><div class="muted">' + D.cuisines[r.cu] + ' · ' + D.courses[r.co] + ' · ' + D.tech[r.te].n.split('(')[0] + '</div></div><span class="q" style="color:' + qColor(p.q) + '">' + p.q + '</span></div>';
        }).join('') + '</div></div>';
    } else if (L.bookTab === 'mine') {
      var cs = Object.keys(S.custom);
      h += '<div class="card"><h2>나의 창작 요리 ' + cs.length + '/' + D.R.maxCustom + '</h2><div class="list">' + (cs.map(function (cid) {
        var p = CK.dish(D, S, 'c:' + cid, se);
        return '<div class="it"><div class="sp" data-a="detail" data-v="c:' + cid + '"><div class="nm">' + esc(p.n) + '</div><div class="muted">' + D.courses[p.co] + ' · ' + D.tech[p.te].n.split('(')[0] + '</div></div><span class="q" style="color:' + qColor(p.q) + '">' + p.q + '</span><button class="btn sm" data-a="delc" data-v="' + cid + '">삭제</button></div>';
      }).join('') || '<p class="muted">연구실에서 레시피에 없는 조합을 만들면 여기에 저장됩니다.</p>') + '</div></div>';
    } else if (L.bookTab === 'sci') {
      h += '<div class="card"><h2>맛의 원리</h2>' + D.know.map(function (k) { return '<h3>' + esc(k.k) + '</h3><p class="muted" style="margin:0">' + esc(k.t) + '</p>'; }).join('') + '</div>';
      h += '<div class="card"><h2>조리법</h2>' + Object.keys(D.tech).map(function (te) { var t = D.tech[te]; return '<h3>' + t.n + ' <span class="tag">' + CK.TEMPK[t.temp] + '</span><span class="tag">반상: ' + t.g + '</span></h3><p class="muted" style="margin:0">' + esc(t.sci) + '</p>'; }).join('') + '</div>';
      h += '<div class="card"><h2>좋은 짝 · 나쁜 짝</h2>' + D.pairs.map(function (p) { return '<div class="note good">' + p.p.map(pname).join(' + ') + ': ' + esc(p.r) + '</div>'; }).join('') + D.clash.map(function (p) { return '<div class="note bad">' + p.p.map(pname).join(' + ') + ': ' + esc(p.r) + '</div>'; }).join('') + '</div>';
    } else {
      h += '<div class="card"><h2>재료 사전</h2><p class="muted">🌱 = 지금(' + D.R.seasons[se] + ') 제철: 맛이 좋고 20% 싸다. 제철이 아니면 30% 비싸다.</p><div class="list">' + Object.keys(D.ing).map(function (id) {
        var g = D.ing[id], top = CK.TN.map(function (t, j) { return [t, g.t[j]]; }).filter(function (x) { return x[1] >= 1; }).map(function (x) { return CK.TK[x[0]] + ' ' + x[1]; }).join(' · ');
        return '<div class="it"><div class="sp"><div class="nm">' + (g.s && g.s.indexOf(se) >= 0 ? '🌱' : '') + esc(g.n) + ' <span class="muted">' + D.cats[g.c] + '</span></div><div class="muted">' + (top || '맛 약함') + (g.u ? ' · ' + { glu: '글루탐산', ino: '이노신산', gua: '구아닐산' }[g.u] : '') + (g.a ? ' · ' + g.a.map(function (a) { return CK.AK[a]; }).join(',') : '') + (g.s ? ' · 제철 ' + g.s.map(function (x) { return D.R.seasons[x]; }).join('·') : '') + '</div></div><span class="muted">' + won(g.p) + '</span></div>';
      }).join('') + '</div></div>';
    }
    return h;
  }
  function pname(t) { return t.indexOf('cat:') === 0 ? D.cats[t.slice(4)] + '류' : (D.ing[t] ? D.ing[t].n : t); }

  /* ---------- 상점 ---------- */
  function shop() {
    var se = season();
    var h = '<div class="card"><h2>🌱 ' + D.R.seasons[se] + ' 제철 재료</h2><div>' + Object.keys(D.ing).filter(function (id) { return D.ing[id].s && D.ing[id].s.indexOf(se) >= 0; }).map(function (id) { return '<span class="tag">' + esc(D.ing[id].n) + '</span>'; }).join('') + '</div><p class="muted" style="margin:0">계절은 7일마다 바뀝니다.</p></div>';
    h += '<div class="card"><h2>📚 요리책</h2><p class="muted" style="margin-top:0">사면 그 책의 레시피를 모두 얻는다. 연구실에서 직접 찾아내면 공짜!</p><div class="list">' + Object.keys(D.books).map(function (b) {
      var x = D.books[b], own = S.books[b], cnt = D.recIds.filter(function (id) { return D.rec[id].src === b; }), got = cnt.filter(function (id) { return S.known[id]; }).length;
      var lock = x.req && x.req.rep > S.rep;
      return '<div class="it"><div class="sp"><div class="nm">' + esc(x.n) + '</div><div class="muted">' + esc(x.d) + ' · 레시피 ' + got + '/' + cnt.length + (lock ? ' · 평판 ' + x.req.rep + ' 필요' : '') + '</div></div>' + (own ? '<span class="tag">보유</span>' : '<button class="btn sm pri" data-a="buybook" data-v="' + b + '" ' + (lock || S.money < x.price ? 'disabled' : '') + '>' + won(x.price) + '</button>') + '</div>';
    }).join('') + '</div></div>';
    h += '<div class="card"><h2>🔧 주방 설비</h2><div class="list">' + Object.keys(D.equip).map(function (e) {
      var x = D.equip[e], own = S.equip[e], lock = (x.req && x.req.rep > S.rep) || (x.req && x.req.equip && !S.equip[x.req.equip]);
      return '<div class="it"><div class="sp"><div class="nm">' + esc(x.n) + '</div><div class="muted">' + esc(x.d) + (x.req && x.req.rep ? ' · 평판 ' + x.req.rep : '') + '</div></div>' + (own ? '<span class="tag">설치됨</span>' : '<button class="btn sm pri" data-a="buyeq" data-v="' + e + '" ' + (lock || S.money < x.price ? 'disabled' : '') + '>' + won(x.price) + '</button>') + '</div>';
    }).join('') + '</div></div>';
    return h;
  }

  function help() {
    modal('<h2 style="margin-top:0">게임 방법</h2>' +
      '<p><b>1. 메뉴 짜기</b> — 코스 요리 또는 한식 반상을 고르고 요리를 배치하세요. 셰프 노트가 흐름·맛 균형·반복·질감·온도·색·계절·영양을 전문가처럼 평가합니다. S등급에 지적이 하나도 없으면 <b>완벽한 식단</b>.</p>' +
      '<p><b>2. 영업</b> — 손님마다 취향(매운맛 마니아, 채식주의자, 미식가…)과 지갑이 다릅니다. 요리 완성도·식단 점수·취향·가격이 만족도를 정하고, 만족도가 평판을 움직입니다.</p>' +
      '<p><b>3. 평론가</b> — 7일마다 미식 평론가가 와서 별(최대 3개)을 줍니다. 별이 많을수록 손님이 늘고 비싼 값도 받아들입니다.</p>' +
      '<p><b>4. 연구실</b> — 조리법과 재료를 골라 실험하세요. 레시피와 맞으면 새 레시피 발견! 아니면 나만의 창작 요리가 됩니다. "익숙한 맛" 힌트를 따라가세요. 연구실에서만 찾을 수 있는 숨은 레시피도 있습니다.</p>' +
      '<p><b>5. 상점</b> — 요리책으로 레시피를, 설비로 새 조리법(튀김·숯불·오븐·발효·훈연·수비드·셔벗)을 얻습니다. 제철 재료는 싸고 맛있습니다.</p>' +
      '<p class="muted">📖 도감 → 요리 과학에서 맛의 원리(감칠맛 상승효과, 대비·억제효과, 산과 지방, 오방색, 반상 첩수 …)를 볼 수 있습니다.</p>');
  }

  /* ---------- 그리기·이벤트 ---------- */
  function render() {
    header(); nav();
    var y = window.scrollY;
    $('main').innerHTML = { home: home, menu: menu, lab: lab, book: book, shop: shop }[L.tab]();
    window.scrollTo(0, y);
    var lq = $('#lq'); if (lq) lq.addEventListener('input', function () { L.labQ = lq.value; var pos = lq.selectionStart; render(); var n = $('#lq'); n.focus(); n.setSelectionRange(pos, pos); });
    var lc = $('#labco'); if (lc) lc.addEventListener('change', function () { L.labCo = lc.value; render(); });
  }
  function setMenu(items, fmt) { act({ type: 'setMenu', format: fmt || S.menu.format, items: items }); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a'), v = el.getAttribute('data-v'), it = S.menu.items.slice();
    switch (a) {
      case 'close': closeModal(); return;
      case 'tab': L.tab = v; window.scrollTo(0, 0); break;
      case 'run': {
        var r = act({ type: 'runDay' });
        if (r.ok) { modal(lastCard(r.res) + '<button class="btn pri big" data-a="close">확인</button>'); if (r.res.critic && r.res.critic.stars > r.res.critic.prev) toast('★ 별을 받았습니다!'); }
        break;
      }
      case 'fmt': setMenu(it, v); break;
      case 'mv': { var k = +v, d = +el.getAttribute('data-d'), j = k + d; if (j < 0 || j >= it.length) return; var t = it[k]; it[k] = it[j]; it[j] = t; setMenu(it); break; }
      case 'rm': it.splice(+v, 1); setMenu(it); break;
      case 'pick': pickModal(); return;
      case 'pickco': L.pickCo = v; pickModal(); return;
      case 'add': it.push(v); setMenu(it); toast('추가했습니다'); render(); pickModal(); return;
      case 'addclose': it.push(v); setMenu(it); closeModal(); toast('메뉴에 추가했습니다'); break;
      case 'detail': { var p = CK.dish(D, S, v); if (p) modal(dishDetail(p, S.menu.items.indexOf(v) < 0 && CK.techOpen(D, S, p.te) ? '<button class="btn pri big" data-a="addclose" data-v="' + v + '">메뉴에 추가</button>' : '')); return; }
      case 'labte': L.labTe = v; break;
      case 'labcat': L.labCat = v; break;
      case 'sel': if (L.labSel.length >= D.R.maxLabIngredients) { toast('재료는 ' + D.R.maxLabIngredients + '가지까지'); return; } L.labSel.push({ id: v, m: 1 }); break;
      case 'unsel': e.stopPropagation(); L.labSel.splice(+v, 1); break;
      case 'amt': { var s = L.labSel[+v]; var idx = AMT.findIndex(function (x) { return x[0] === s.m; }); s.m = AMT[(idx + 1) % AMT.length][0]; break; }
      case 'cook': {
        var r2 = act({ type: 'cook', te: L.labTe, co: L.labCo === 'auto' ? null : L.labCo, i: L.labSel.map(function (s) { return s.m === 1 ? s.id : s.id + '*' + s.m; }) });
        if (r2.ok) { render(); cookResult(r2.res); return; }
        break;
      }
      case 'cname': act({ type: 'renameCustom', cid: v, n: $('#cname').value }); toast('저장했습니다'); break;
      case 'delc': if (confirm('삭제할까요?')) act({ type: 'delCustom', cid: v }); break;
      case 'btab': L.bookTab = v; break;
      case 'cuf': L.cuF = v; break;
      case 'buybook': { var r3 = act({ type: 'buyBook', id: v }); if (r3.ok) toast('레시피 ' + r3.res.got.length + '개를 얻었습니다'); break; }
      case 'buyeq': if (act({ type: 'buyEquip', id: v }).ok) toast('설치했습니다'); break;
      case 'rename': act({ type: 'rename', name: $('#rname').value }); break;
      case 'newgame': if (confirm('처음부터 다시 시작할까요? 지금 진행은 사라집니다.')) { S = CK.newGame(D, (Date.now() % 1e9) + 1); save(); L.tab = 'home'; closeModal(); help(); } break;
      case 'help': help(); return;
    }
    render();
  });
  document.addEventListener('change', function (e) { if (e.target.getAttribute('data-a') === 'price') { act({ type: 'setPrice', rate: e.target.value / 100 }); render(); } });
  document.addEventListener('input', function (e) {
    if (e.target.getAttribute('data-a') === 'price') { var mp = CK.menuPrice(D, S); var b = e.target.parentNode.querySelector('.big'); if (b) b.textContent = won(Math.round(mp.base * e.target.value / 100 / 100) * 100); }
    if (e.target.id === 'pq') return;
  });

  window.CK_BOOT = function (raw) {
    D = CK.makeData(raw);
    S = load();
    var first = !S;
    if (!S) { S = CK.newGame(D, (Date.now() % 1e9) + 1); save(); }
    render();
    if (first) help();
  };
})();
</script>

"생선과 고기 사이, 또는 기름진 요리 뒤에 셔벗·초절임처럼 차갑고 새콤한 것을 두면 혀가 리셋된다."},{"k":"질감과 온도의 대비","t":"사람은 한 가지 질감에 금방 질린다. 바삭함·부드러움·쫄깃함, 뜨거움·차가움이 번갈아 나오면 같은 맛도 더 맛있게 느껴진다."},{"k":"반상과 첩수","t":"밥·국·김치·장은 기본이고, 그 밖의 반찬 수를 '첩'이라 한다(3·5·7·9·12첩). 반찬끼리 조리법(생채·숙채·구이·조림·전·마른반찬·젓갈)과 재료가 겹치지 않게 짜는 것이 원칙."},{"k":"오방색","t":"청(초록)·적(빨강)·황(노랑)·백(흰색)·흑(검정)의 다섯 색. 한식은 한 상에 오방색을 고루 담아 눈과 영양의 균형을 맞췄다. 비빔밥·구절판·고명."},{"k":"제철","t":"제철 재료는 맛(당·감칠맛)이 가장 오르고 값은 가장 싸다. 봄 나물·딸기, 여름 오이·토마토, 가을 버섯·고등어, 겨울 굴·무·유자."},{"k":"원가율","t":"판매가에서 재료비가 차지하는 비율. 보통 식당은 30% 안팎을 목표로 한다. 너무 비싸면 손님이 줄고, 너무 싸면 남는 것이 없다."},{"k":"식품 안전","t":"닭·돼지고기는 반드시 속까지 익힌다(살모넬라·기생충). 날로 먹는 생선·소고기·굴은 신선도가 생명."},{"k":"비린내 잡기","t":"생선 비린내의 주범 트리메틸아민은 염기성이라 레몬·식초 같은 산에 중화된다. 생강·깻잎·술은 향으로 가려 준다."}]}};</script>
