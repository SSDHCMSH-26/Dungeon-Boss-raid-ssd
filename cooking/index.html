<script>
/* 개발용: data/*.json 을 읽어서 시작 (웹서버로 열 것). 배포용 한 파일은 tools/build.js → dist/index.html */
(function () {
  var F = ['ingredients', 'techniques', 'recipes', 'pairings', 'shop', 'customers', 'rules', 'knowledge'];
  if (window.CK_DATA) return CK_BOOT(window.CK_DATA);
  Promise.all(F.map(function (f) { return fetch('data/' + f + '.json').then(function (r) { return r.json(); }); }))
    .then(function (a) { var o = {}; F.forEach(function (f, k) { o[f] = a[k]; }); CK_BOOT(o); })
    .catch(function (e) { document.querySelector('main').innerHTML = '<p>데이터를 읽지 못했습니다. dist/index.html 을 쓰거나 웹서버로 여세요.</p>'; });
})();
</script>
